<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural 3D Solar System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000011);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 20;
        controls.maxDistance = 100;

        // Procedural texture generators
        function createStripedGasGiantTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const gradients = [
                '#c4a574', '#b8956a', '#a08060', '#d4b890', '#c0a080'
            ];

            for (let i = 0; i < 20; i++) {
                const y = (i / 20) * canvas.height;
                const height = canvas.height / 20 + Math.random() * 10;
                const color = gradients[Math.floor(Math.random() * gradients.length)];
                ctx.fillStyle = color;
                ctx.fillRect(0, y, canvas.width, height);
            }

            // Add some turbulence
            for (let i = 0; i < 500; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.1})`;
                ctx.beginPath();
                ctx.arc(x, y, Math.random() * 3, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            return texture;
        }

        function createCrateredRockyTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Base color
            ctx.fillStyle = '#8b7355';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add noise
            for (let i = 0; i < 5000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const gray = Math.floor(Math.random() * 60 + 100);
                ctx.fillStyle = `rgb(${gray}, ${gray - 20}, ${gray - 40})`;
                ctx.fillRect(x, y, 2, 2);
            }

            // Add craters
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 20 + 5;

                // Crater shadow
                ctx.beginPath();
                ctx.arc(x + 2, y + 2, radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();

                // Crater
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(60, 50, 40, 0.5)';
                ctx.fill();

                // Crater rim highlight
                ctx.beginPath();
                ctx.arc(x - 1, y - 1, radius * 0.9, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(120, 100, 80, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function createEarthLikeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Ocean base
            ctx.fillStyle = '#1a4d7c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Continents
            ctx.fillStyle = '#3d8c40';
            const continents = [
                {x: 50, y: 80, w: 100, h: 60},
                {x: 200, y: 50, w: 80, h: 100},
                {x: 320, y: 100, w: 120, h: 80},
                {x: 450, y: 60, w: 50, h: 70}
            ];

            continents.forEach(cont => {
                ctx.beginPath();
                ctx.ellipse(cont.x, cont.y, cont.w, cont.h, 0, 0, Math.PI * 2);
                ctx.fill();
            });

            // Add some variation
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.fillStyle = `rgba(${Math.random() > 0.5 ? '61, 140, 64' : '20, 80, 120'}, 0.3)`;
                ctx.beginPath();
                ctx.arc(x, y, Math.random() * 10, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function createRingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, 'rgba(210, 180, 140, 0)');
            gradient.addColorStop(0.2, 'rgba(210, 180, 140, 0.8)');
            gradient.addColorStop(0.3, 'rgba(210, 180, 140, 0.3)');
            gradient.addColorStop(0.5, 'rgba(210, 180, 140, 0.9)');
            gradient.addColorStop(0.7, 'rgba(210, 180, 140, 0.4)');
            gradient.addColorStop(0.85, 'rgba(210, 180, 140, 0.7)');
            gradient.addColorStop(1, 'rgba(210, 180, 140, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add ring particles
            for (let i = 0; i < 1000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
                ctx.fillRect(x, y, 1, 1);
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // Create the Sun
        const sunGeometry = new THREE.SphereGeometry(5, 64, 64);
        const sunMaterial = new THREE.MeshStandardMaterial({
            color: 0xffaa00,
            emissive: 0xff6600,
            emissiveIntensity: 1.5,
            roughness: 0.5,
            metalness: 0.1
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Point light inside the sun
        const sunLight = new THREE.PointLight(0xffffff, 2, 100);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // Ambient light
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        // Planet data
        const planetsData = [
            { name: 'Mercury', distance: 10, size: 0.8, speed: 0.04, color: 0x8b8b8b, textureType: 'cratered' },
            { name: 'Venus', distance: 15, size: 1.2, speed: 0.025, color: 0xe6c87a, textureType: 'rocky' },
            { name: 'Earth', distance: 22, size: 1.3, speed: 0.02, color: 0x2266ff, textureType: 'earth' },
            { name: 'Mars', distance: 30, size: 1.0, speed: 0.016, color: 0xcc4422, textureType: 'cratered' },
            { name: 'Jupiter', distance: 42, size: 3.5, speed: 0.008, color: 0xc4a574, textureType: 'gas' },
            { name: 'Saturn', distance: 55, size: 3.0, speed: 0.006, color: 0xd4b890, textureType: 'gas', hasRings: true },
            { name: 'Uranus', distance: 68, size: 2.0, speed: 0.004, color: 0x66ccff, textureType: 'gas' },
            { name: 'Neptune', distance: 80, size: 1.9, speed: 0.003, color: 0x3366ff, textureType: 'gas' }
        ];

        const planets = [];

        // Create planets
        planetsData.forEach(data => {
            // Create orbit group (for revolution)
            const orbitGroup = new THREE.Group();
            scene.add(orbitGroup);

            // Create planet group (holds planet and can rotate)
            const planetGroup = new THREE.Group();
            planetGroup.position.x = data.distance;
            orbitGroup.add(planetGroup);

            // Get texture based on type
            let texture;
            switch(data.textureType) {
                case 'gas':
                    texture = createStripedGasGiantTexture();
                    break;
                case 'cratered':
                    texture = createCrateredRockyTexture();
                    break;
                case 'earth':
                    texture = createEarthLikeTexture();
                    break;
                default:
                    texture = createCrateredRockyTexture();
            }

            // Create planet mesh
            const planetGeometry = new THREE.SphereGeometry(data.size, 32, 32);
            const planetMaterial = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.8,
                metalness: 0.1
            });
            const planet = new THREE.Mesh(planetGeometry, planetMaterial);
            planetGroup.add(planet);

            // Add rings for Saturn
            if (data.hasRings) {
                const ringGeometry = new THREE.RingGeometry(data.size * 1.4, data.size * 2.2, 64);
                const ringMaterial = new THREE.MeshBasicMaterial({
                    map: createRingTexture(),
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.8
                });
                
                // Adjust UV mapping for ring
                const positions = ringGeometry.attributes.position;
                const uvs = ringGeometry.attributes.uv;
                for (let i = 0; i < positions.count; i++) {
                    const x = positions.getX(i);
                    const y = positions.getY(i);
                    const dist = Math.sqrt(x * x + y * y);
                    const normalizedDist = (dist - data.size * 1.4) / (data.size * 0.8);
                    uvs.setXY(i, normalizedDist, uvs.getY(i));
                }
                uvs.needsUpdate = true;

                const rings = new THREE.Mesh(ringGeometry, ringMaterial);
                rings.rotation.x = Math.PI / 2;
                rings.rotation.y = Math.PI / 8;
                planetGroup.add(rings);
            }

            // Create orbit line
            const orbitCurve = new THREE.EllipseCurve(0, 0, data.distance, data.distance, 0, Math.PI * 2);
            const orbitPoints = orbitCurve.getPoints(128);
            const orbitGeometry = new THREE.BufferGeometry().setFromPoints(orbitPoints);
            const orbitMaterial = new THREE.LineBasicMaterial({ 
                color: 0x444466, 
                transparent: true, 
                opacity: 0.4 
            });
            const orbitLine = new THREE.LineLoop(orbitGeometry, orbitMaterial);
            orbitLine.rotation.x = Math.PI / 2;
            scene.add(orbitLine);

            planets.push({
                group: orbitGroup,
                planetGroup: planetGroup,
                mesh: planet,
                speed: data.speed,
                angle: Math.random() * Math.PI * 2,
                selfRotationSpeed: 0.01 + Math.random() * 0.02
            });
        });

        // Starfield background
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = [];
        for (let i = 0; i < 3000; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 200;
            starPositions.push(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Sun pulsing animation
            const pulseScale = 1 + Math.sin(time * 2) * 0.02;
            sun.scale.set(pulseScale, pulseScale, pulseScale);

            // Update planets
            planets.forEach(planet => {
                // Revolution around sun
                planet.angle += planet.speed;
                planet.group.rotation.y = planet.angle;

                // Self rotation
                planet.mesh.rotation.y += planet.selfRotationSpeed;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
