<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Crystal Hero Scene</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 15;

        // Main crystal - Icosahedron with high detail
        const crystalGeometry = new THREE.IcosahedronGeometry(1, 2);
        const crystalMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            roughness: 0.1,
            metalness: 0.1,
            transmission: 0.9,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            ior: 1.5,
            thickness: 1.0,
            envMapIntensity: 1.5,
            transparent: true
        });
        const mainCrystal = new THREE.Mesh(crystalGeometry, crystalMaterial);
        mainCrystal.castShadow = true;
        mainCrystal.receiveShadow = true;
        scene.add(mainCrystal);

        // Floating orbitals
        const orbitals = [];
        const orbitalConfigs = [
            { geometry: new THREE.OctahedronGeometry(0.3), distance: 2.5, speed: 0.02, axis: new THREE.Vector3(1, 0, 0) },
            { geometry: new THREE.TetrahedronGeometry(0.25), distance: 3, speed: 0.015, axis: new THREE.Vector3(0, 1, 0) },
            { geometry: new THREE.OctahedronGeometry(0.2), distance: 2, speed: 0.025, axis: new THREE.Vector3(0, 0, 1) },
            { geometry: new THREE.IcosahedronGeometry(0.15, 1), distance: 3.5, speed: 0.01, axis: new THREE.Vector3(1, 1, 0).normalize() },
            { geometry: new THREE.OctahedronGeometry(0.18), distance: 2.8, speed: 0.018, axis: new THREE.Vector3(1, 0, 1).normalize() }
        ];

        orbitalConfigs.forEach(config => {
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x88ccff,
                roughness: 0.2,
                metalness: 0.3,
                transmission: 0.7,
                ior: 1.4,
                emissive: 0x224466,
                emissiveIntensity: 0.3
            });

            const orbital = new THREE.Mesh(config.geometry, material);
            orbital.castShadow = true;
            
            const angle = Math.random() * Math.PI * 2;
            orbital.userData = {
                distance: config.distance,
                speed: config.speed,
                axis: config.axis,
                angle: angle,
                tiltAxis: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize()
            };
            
            scene.add(orbital);
            orbitals.push(orbital);
        });

        // Three-point studio lighting setup
        // Key light (warm)
        const keyLight = new THREE.SpotLight(0xffddaa, 10);
        keyLight.position.set(5, 5, 5);
        keyLight.angle = Math.PI / 6;
        keyLight.penumbra = 0.5;
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        scene.add(keyLight);

        // Fill light (cool)
        const fillLight = new THREE.SpotLight(0xaaccff, 5);
        fillLight.position.set(-5, 3, 3);
        fillLight.angle = Math.PI / 4;
        fillLight.penumbra = 0.8;
        fillLight.castShadow = true;
        scene.add(fillLight);

        // Rim light (warm accent)
        const rimLight = new THREE.SpotLight(0xffaa88, 3);
        rimLight.position.set(0, 5, -5);
        rimLight.angle = Math.PI / 6;
        rimLight.penumbra = 0.5;
        rimLight.castShadow = true;
        scene.add(rimLight);

        // Ambient light for base illumination
        const ambientLight = new THREE.AmbientLight(0x333355, 0.5);
        scene.add(ambientLight);

        // Mouse interaction
        let mouseX = 0;
        let mouseY = 0;
        let targetTiltX = 0;
        let targetTiltY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Raycaster for hover detection
        const raycaster = new THREE.Raycaster();
        const mouseVector = new THREE.Vector2();
        let isHovering = false;

        document.addEventListener('mousemove', (event) => {
            mouseVector.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouseVector.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Float main crystal
            mainCrystal.position.y = Math.sin(time) * 0.2;
            mainCrystal.rotation.y += 0.005;
            mainCrystal.rotation.z = Math.sin(time * 0.5) * 0.1;

            // Tilt crystal towards mouse
            targetTiltY = mouseX * 0.3;
            targetTiltX = mouseY * 0.3;
            
            mainCrystal.rotation.x += (targetTiltX - mainCrystal.rotation.x) * 0.05;
            mainCrystal.rotation.y += (targetTiltY - mainCrystal.rotation.y) * 0.05;

            // Update orbitals
            orbitals.forEach(orbital => {
                const data = orbital.userData;
                data.angle += data.speed;
                
                // Orbital motion around main crystal
                orbital.position.x = Math.cos(data.angle) * data.distance;
                orbital.position.z = Math.sin(data.angle) * data.distance;
                orbital.position.y = Math.sin(data.angle * 0.5) * 0.5;

                // Self rotation with tilt
                orbital.rotateOnAxis(data.tiltAxis, 0.01);
            });

            // Hover detection
            raycaster.setFromCamera(mouseVector, camera);
            const intersects = raycaster.intersectObject(mainCrystal);
            
            if (intersects.length > 0) {
                if (!isHovering) {
                    isHovering = true;
                    crystalMaterial.emissive = new THREE.Color(0x4488ff);
                    crystalMaterial.emissiveIntensity = 0.5;
                    document.body.style.cursor = 'pointer';
                }
            } else {
                if (isHovering) {
                    isHovering = false;
                    crystalMaterial.emissive = new THREE.Color(0x000000);
                    crystalMaterial.emissiveIntensity = 0;
                    document.body.style.cursor = 'default';
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
