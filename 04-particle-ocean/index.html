<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Particle Ocean</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup with logarithmic fog
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000510);
        scene.fog = new THREE.FogExp2(0x000510, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 3, 15);
        camera.lookAt(0, 0, -20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        controls.minDistance = 5;
        controls.maxDistance = 50;

        // Create 100x100 particle grid
        const gridSize = 100;
        const particleCount = gridSize * gridSize;
        const geometry = new THREE.BufferGeometry();

        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const originalPositions = new Float32Array(particleCount * 3);

        // Deep blue to bright neon purple color palette
        const deepBlue = new THREE.Color(0x001a4d);
        const midBlue = new THREE.Color(0x0066ff);
        const cyan = new THREE.Color(0x00ffff);
        const neonPurple = new THREE.Color(0xcc33ff);
        const brightPink = new THREE.Color(0xff33aa);

        // Initialize particle positions
        for (let i = 0; i < particleCount; i++) {
            const x = (i % gridSize) - gridSize / 2;
            const z = Math.floor(i / gridSize) - gridSize / 2;
            const y = 0;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            originalPositions[i * 3] = x;
            originalPositions[i * 3 + 1] = y;
            originalPositions[i * 3 + 2] = z;

            // Initial color (deep blue)
            colors[i * 3] = deepBlue.r;
            colors[i * 3 + 1] = deepBlue.g;
            colors[i * 3 + 2] = deepBlue.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Custom shader material for smooth color gradient based on height
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 }
            },
            vertexShader: `
                attribute vec3 color;
                varying vec3 vColor;
                uniform float time;
                
                void main() {
                    vec3 pos = position;
                    
                    // Store original x and z for wave calculation
                    float x = pos.x;
                    float z = pos.z;
                    
                    // Complex wave animation using sine and cosine combinations
                    float wave1 = sin(x * 0.3 + time * 0.8) * cos(z * 0.2 + time * 0.6) * 1.5;
                    float wave2 = sin(x * 0.5 - time * 0.5) * 0.8;
                    float wave3 = cos(z * 0.4 + time * 0.7) * 0.6;
                    float wave4 = sin(x * 0.2 + z * 0.3 + time * 0.4) * 0.4;
                    
                    // Combine waves for organic ocean motion
                    pos.y = wave1 + wave2 + wave3 + wave4;
                    
                    // Calculate color based on height
                    float height = pos.y;
                    vec3 deepBlue = vec3(0.0, 0.1, 0.3);
                    vec3 midBlue = vec3(0.0, 0.4, 1.0);
                    vec3 cyan = vec3(0.0, 1.0, 1.0);
                    vec3 neonPurple = vec3(0.8, 0.2, 1.0);
                    vec3 brightPink = vec3(1.0, 0.2, 0.67);
                    
                    // Smooth color transitions based on height
                    if (height < -1.0) {
                        vColor = mix(deepBlue, midBlue, smoothstep(-2.0, -1.0, height));
                    } else if (height < 0.0) {
                        vColor = mix(midBlue, cyan, smoothstep(-1.0, 0.0, height));
                    } else if (height < 1.5) {
                        vColor = mix(cyan, neonPurple, smoothstep(0.0, 1.5, height));
                    } else {
                        vColor = mix(neonPurple, brightPink, smoothstep(1.5, 2.5, height));
                    }
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = 4.0 * (30.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                
                void main() {
                    // Create circular particle
                    float r = distance(gl_PointCoord, vec2(0.5));
                    if (r > 0.5) discard;
                    
                    // Soft edge glow
                    float alpha = 1.0 - smoothstep(0.3, 0.5, r);
                    
                    gl_FragColor = vec4(vColor, alpha * 0.9);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Add some ambient light for subtle illumination
        const ambientLight = new THREE.AmbientLight(0x112244, 0.3);
        scene.add(ambientLight);

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            // Update shader time uniform
            material.uniforms.time.value = time;

            // Alternative: Direct position update approach (commented out since we use shader)
            // If you want to use CPU-based updates instead, uncomment below:
            /*
            const positions = geometry.attributes.position.array;
            const colors = geometry.attributes.color.array;
            
            for (let i = 0; i < particleCount; i++) {
                const x = originalPositions[i * 3];
                const z = originalPositions[i * 3 + 2];
                
                // Wave calculation
                const wave1 = Math.sin(x * 0.3 + time * 0.8) * Math.cos(z * 0.2 + time * 0.6) * 1.5;
                const wave2 = Math.sin(x * 0.5 - time * 0.5) * 0.8;
                const wave3 = Math.cos(z * 0.4 + time * 0.7) * 0.6;
                const wave4 = Math.sin(x * 0.2 + z * 0.3 + time * 0.4) * 0.4;
                
                const y = wave1 + wave2 + wave3 + wave4;
                
                positions[i * 3 + 1] = y;
                
                // Color based on height
                let color;
                if (y < -1.0) {
                    color = deepBlue.clone().lerp(midBlue, (y + 2.0));
                } else if (y < 0.0) {
                    color = midBlue.clone().lerp(cyan, (y + 1.0));
                } else if (y < 1.5) {
                    color = cyan.clone().lerp(neonPurple, y / 1.5);
                } else {
                    color = neonPurple.clone().lerp(brightPink, (y - 1.5));
                }
                
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }
            
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            */

            // Slow camera drift
            camera.position.x = Math.sin(time * 0.1) * 5;
            camera.lookAt(0, 0, -20);

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
