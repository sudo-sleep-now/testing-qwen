<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Product Display Pedestal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
        canvas { display: block; }
        
        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        
        .ui-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .ui-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
        
        .ui-btn.active {
            background: rgba(0, 255, 255, 0.3);
            border-color: #00ffff;
        }
        
        .title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="title">Artifact Display</div>
    <div class="ui-overlay">
        <button class="ui-btn" id="rotateBtn">Rotate</button>
        <button class="ui-btn" id="zoomInBtn">Zoom In</button>
        <button class="ui-btn" id="zoomOutBtn">Zoom Out</button>
        <button class="ui-btn" id="neonBtn">Toggle Neon Mode</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup - minimalist studio
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 15;
        controls.maxPolarAngle = Math.PI / 2 + 0.3;

        // Curved backdrop (infinity cove effect)
        const backdropGeometry = new THREE.CylinderGeometry(15, 15, 20, 64, 1, true, 0, Math.PI * 2);
        const backdropMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xe8e8e8,
            roughness: 0.9,
            metalness: 0.0,
            side: THREE.BackSide
        });
        const backdrop = new THREE.Mesh(backdropGeometry, backdropMaterial);
        backdrop.position.y = 5;
        scene.add(backdrop);

        // Floor plane
        const floorGeometry = new THREE.PlaneGeometry(30, 30);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffffff,
            roughness: 0.5,
            metalness: 0.1
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Layered cylindrical pedestal
        const pedestalGroup = new THREE.Group();

        // Base layer
        const baseGeometry = new THREE.CylinderGeometry(2, 2.2, 0.3, 64);
        const baseMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x2a2a3a,
            roughness: 0.3,
            metalness: 0.8
        });
        const base = new THREE.Mesh(baseGeometry, baseMaterial);
        base.position.y = 0.15;
        base.castShadow = true;
        base.receiveShadow = true;
        pedestalGroup.add(base);

        // Middle layer
        const middleGeometry = new THREE.CylinderGeometry(1.5, 1.8, 0.4, 64);
        const middleMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a2a,
            roughness: 0.2,
            metalness: 0.9
        });
        const middle = new THREE.Mesh(middleGeometry, middleMaterial);
        middle.position.y = 0.5;
        middle.castShadow = true;
        middle.receiveShadow = true;
        pedestalGroup.add(middle);

        // Top platform
        const topGeometry = new THREE.CylinderGeometry(1.2, 1.3, 0.2, 64);
        const topMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x0a0a1a,
            roughness: 0.1,
            metalness: 1.0
        });
        const top = new THREE.Mesh(topGeometry, topMaterial);
        top.position.y = 0.8;
        top.castShadow = true;
        top.receiveShadow = true;
        pedestalGroup.add(top);

        // Glowing ring strip on top edge
        const ringGeometry = new THREE.TorusGeometry(1.2, 0.03, 16, 64);
        const ringMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff,
            transparent: true,
            opacity: 0.8
        });
        const glowRing = new THREE.Mesh(ringGeometry, ringMaterial);
        glowRing.rotation.x = Math.PI / 2;
        glowRing.position.y = 0.9;
        pedestalGroup.add(glowRing);

        scene.add(pedestalGroup);

        // Abstract futuristic artifact/sculpture
        const artifactGroup = new THREE.Group();

        // Main body - elongated sphere
        const bodyGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        bodyGeometry.scale(1, 1.5, 0.7);
        const bodyMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x111122,
            roughness: 0.2,
            metalness: 0.9
        });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.position.y = 1.3;
        body.castShadow = true;
        artifactGroup.add(body);

        // Upper cone spike
        const coneGeometry = new THREE.ConeGeometry(0.3, 0.8, 32);
        const coneMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222233,
            roughness: 0.1,
            metalness: 1.0
        });
        const cone = new THREE.Mesh(coneGeometry, coneMaterial);
        cone.position.y = 2.0;
        cone.castShadow = true;
        artifactGroup.add(cone);

        // Floating rings around artifact
        const ring1Geometry = new THREE.TorusGeometry(0.7, 0.02, 16, 64);
        const ring1Material = new THREE.MeshStandardMaterial({ 
            color: 0x333344,
            roughness: 0.1,
            metalness: 1.0,
            emissive: 0x000000,
            emissiveIntensity: 0
        });
        const ring1 = new THREE.Mesh(ring1Geometry, ring1Material);
        ring1.rotation.x = Math.PI / 3;
        ring1.position.y = 1.5;
        ring1.castShadow = true;
        artifactGroup.add(ring1);

        const ring2Geometry = new THREE.TorusGeometry(0.5, 0.02, 16, 64);
        const ring2 = new THREE.Mesh(ring2Geometry, ring1Material.clone());
        ring2.rotation.x = -Math.PI / 4;
        ring2.position.y = 1.3;
        ring2.castShadow = true;
        artifactGroup.add(ring2);

        // Small floating spheres
        const smallSphereGeometry = new THREE.SphereGeometry(0.1, 16, 16);
        const smallSphereMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x444455,
            roughness: 0.1,
            metalness: 1.0
        });
        
        for (let i = 0; i < 5; i++) {
            const sphere = new THREE.Mesh(smallSphereGeometry, smallSphereMaterial.clone());
            const angle = (i / 5) * Math.PI * 2;
            sphere.position.set(
                Math.cos(angle) * 0.8,
                1.0 + Math.sin(angle * 2) * 0.3,
                Math.sin(angle) * 0.8
            );
            sphere.castShadow = true;
            artifactGroup.add(sphere);
        }

        scene.add(artifactGroup);

        // Studio lighting setup
        // Overhead spotlight aimed at artifact
        const spotlight = new THREE.SpotLight(0xffffff, 15);
        spotlight.position.set(0, 8, 0);
        spotlight.target = artifactGroup;
        spotlight.angle = Math.PI / 6;
        spotlight.penumbra = 0.5;
        spotlight.castShadow = true;
        spotlight.shadow.mapSize.width = 2048;
        spotlight.shadow.mapSize.height = 2048;
        scene.add(spotlight);

        // Key light (warm)
        const keyLight = new THREE.DirectionalLight(0xffeedd, 3);
        keyLight.position.set(5, 5, 5);
        keyLight.castShadow = true;
        scene.add(keyLight);

        // Fill light (cool)
        const fillLight = new THREE.DirectionalLight(0xddeeff, 1.5);
        fillLight.position.set(-5, 3, 3);
        scene.add(fillLight);

        // Rim light
        const rimLight = new THREE.DirectionalLight(0xffffff, 2);
        rimLight.position.set(0, 3, -5);
        scene.add(rimLight);

        // Ambient light
        const ambientLight = new THREE.AmbientLight(0xaaaaaa, 0.5);
        scene.add(ambientLight);

        // State variables
        let isNeonMode = false;
        let targetZoom = 8;
        let autoRotate = false;

        // UI Button handlers with smooth interpolation
        document.getElementById('rotateBtn').addEventListener('click', () => {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 2;
            document.getElementById('rotateBtn').classList.toggle('active', autoRotate);
        });

        document.getElementById('zoomInBtn').addEventListener('click', () => {
            targetZoom = 4;
        });

        document.getElementById('zoomOutBtn').addEventListener('click', () => {
            targetZoom = 8;
        });

        document.getElementById('neonBtn').addEventListener('click', () => {
            isNeonMode = !isNeonMode;
            document.getElementById('neonBtn').classList.toggle('active', isNeonMode);

            if (isNeonMode) {
                // Enable neon mode
                ringMaterial.color.setHex(0xff00ff);
                ringMaterial.opacity = 1;
                
                ring1.material.emissive.setHex(0x00ffff);
                ring1.material.emissiveIntensity = 0.8;
                ring2.material.emissive.setHex(0xff00ff);
                ring2.material.emissiveIntensity = 0.8;

                artifactGroup.children.forEach(child => {
                    if (child.material && child.material.emissive !== undefined) {
                        child.material.emissiveIntensity = 0.3;
                    }
                });

                // Change backdrop to dark
                backdropMaterial.color.setHex(0x0a0a15);
                floorMaterial.color.setHex(0x11111a);
                scene.background.setHex(0x050510);
            } else {
                // Disable neon mode
                ringMaterial.color.setHex(0x00ffff);
                ringMaterial.opacity = 0.8;
                
                ring1.material.emissive.setHex(0x000000);
                ring1.material.emissiveIntensity = 0;
                ring2.material.emissive.setHex(0x000000);
                ring2.material.emissiveIntensity = 0;

                artifactGroup.children.forEach(child => {
                    if (child.material && child.material.emissive !== undefined) {
                        child.material.emissiveIntensity = 0;
                    }
                });

                // Restore light backdrop
                backdropMaterial.color.setHex(0xe8e8e8);
                floorMaterial.color.setHex(0xffffff);
                scene.background.setHex(0xf5f5f5);
            }
        });

        // Animation loop with smooth camera interpolation
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Smooth zoom interpolation
            const currentDist = camera.position.length();
            const lerpFactor = 0.05;
            const newDist = currentDist + (targetZoom - currentDist) * lerpFactor;
            camera.position.normalize().multiplyScalar(newDist);

            // Rotate artifact slowly
            artifactGroup.rotation.y += 0.005;
            
            // Float artifact gently
            artifactGroup.position.y = Math.sin(time * 2) * 0.05;

            // Rotate floating rings at different speeds
            ring1.rotation.z += 0.01;
            ring2.rotation.z -= 0.015;

            // Animate small spheres
            artifactGroup.children.forEach((child, i) => {
                if (child.geometry && child.geometry.type === 'SphereGeometry' && child.geometry.parameters.radius === 0.1) {
                    child.position.y = 1.0 + Math.sin(time * 2 + i) * 0.2;
                    child.rotation.y += 0.02;
                }
            });

            // Pulse glow ring in neon mode
            if (isNeonMode) {
                ringMaterial.opacity = 0.8 + Math.sin(time * 3) * 0.2;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
